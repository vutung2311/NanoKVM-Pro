# AIC8800 Wi-Fi driver debug level bitmask:
#   0x0001 = LOGERROR, 0x0002 = LOGINFO, 0x0004 = LOGTRACE, 0x0008 = LOGDEBUG
# 3 = LOGERROR|LOGINFO: silences verbose LOGTRACE (4) and LOGDEBUG (8) while keeping info and errors.
options aic8800_fdrv aicwf_dbg_level=3
options aic8800_bsp aicwf_dbg_level_bsp=3
